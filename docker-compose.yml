services:

  # ── Base de dados PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartgest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       smartgest
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${SMARTGEST_POSTGRES_PASSWORD:?Set SMARTGEST_POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"          # expõe para o Desktop na máquina host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartgest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smartgest_net

  # ── SmartGest API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: SmartGest.API.Dockerfile
    container_name: smartgest_api
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=smartgest;Username=postgres;Password=${SMARTGEST_POSTGRES_PASSWORD}"
      Jwt__Key:      ${SMARTGEST_JWT_KEY:?Set SMARTGEST_JWT_KEY in .env}
      Jwt__Issuer:   ${SMARTGEST_JWT_ISSUER:-SmartGest.API}
      Jwt__Audience: ${SMARTGEST_JWT_AUDIENCE:-SmartGest.Desktop}
    ports:
      - "8080:8080"
    networks:
      - smartgest_net

volumes:
  postgres_data:
    driver: local

networks:
  smartgest_net:
    driver: bridge
