name: SmartGest Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore SmartGest.slnx
      - name: Publish Windows x64
        run: dotnet publish SmartGest.Desktop/SmartGest.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishTrimmed=false --property:DebugType=None --output artifacts/publish/win-x64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Installer\SmartGest.iss"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartGest-Windows-Installer
          path: artifacts/installer/SmartGest-Setup-*.exe
          if-no-files-found: error
